name: 'Triagebot'
description: 'AI-powered issue triage bot with a label-driven state machine. Runs on GitHub and on self-hosted Gitea.'
author: 'withastro'

inputs:
  forge:
    description: 'Code host: "github" or "gitea". Leave empty to auto-detect (Gitea Actions sets GITEA_ACTIONS=true).'
    required: false
  server-url:
    description: 'Web base URL of the forge (e.g. https://gitea.example.com). Defaults to GITHUB_SERVER_URL.'
    required: false
  api-url:
    description: 'REST API base URL. Defaults to GITHUB_API_URL, else https://api.github.com for github.com, <server>/api/v3 for GitHub Enterprise, <server>/api/v1 for Gitea.'
    required: false
  base-branch:
    description: 'Branch that fixes are diffed against and pull requests target'
    default: 'main'

  read-token:
    description: 'Token for reading issues, labels, and PRs'
    required: true
  write-token:
    description: 'Token for posting comments, pushing branches, creating PRs, and managing labels'
    required: true
  anthropic-api-key:
    description: 'Anthropic API key for LLM calls. Required unless Cloudflare Workers AI credentials are provided.'
    required: false
  cloudflare-api-key:
    description: 'Cloudflare API token with Workers AI access. Enables using cloudflare-workers-ai/* models (e.g. Kimi). Requires cloudflare-account-id.'
    required: false
  cloudflare-account-id:
    description: 'Cloudflare account ID for the Workers AI REST endpoint. Required when cloudflare-api-key is set.'
    required: false

  triage-skill:
    description: 'Path to triage skill directory (SKILL.md, reproduce.md, diagnose.md, verify.md, fix.md)'
    required: true
  pr-skill:
    description: 'Path to PR writer skill directory. If not provided, uses a built-in prompt to generate PR title and body.'
    required: false
  pr-skill-name:
    description: 'The skill name (from SKILL.md frontmatter) to invoke for PR generation. Only used when pr-skill is set.'
    default: 'pr-writer'
  auto-pr-on-fix:
    description: 'When true, open a pull request immediately after triage finds and pushes a fix, skipping the reporter-confirmation (preview release) flow. Default false preserves the confirm-first behavior.'
    default: 'false'
  build-command:
    description: 'Command to build the project before triage runs (e.g. "pnpm install && pnpm build")'
    required: false
  preview-release-command:
    description: >-
      Shell command that publishes a testable preview build and prints one install URL per line.
      "{packages}" is replaced with the changed package directories.
      Required for the reporter-confirmation flow on any forge other than github.com, since the
      built-in pkg.pr.new publisher only works there. Leave empty and set auto-pr-on-fix to skip previews.
    required: false

  bot-logins:
    description: 'Comma-separated list of bot usernames whose comments should be ignored (the forge''s own Actions bot is always included)'
    default: ''

  priority-label-pattern:
    description: 'Regex matching the repo labels that represent priority. Default matches the Astro convention.'
    default: '^- P\d'
  package-label-pattern:
    description: 'Regex matching the repo labels that represent packages/areas. Default matches the Astro convention.'
    default: '^pkg:'

  triage-model:
    description: 'Model for the triage pipeline (reproduce/diagnose/verify/fix)'
    default: 'anthropic/claude-opus-4-6'
  verification-model:
    description: 'Model for fix verification and retriage checks'
    default: 'anthropic/claude-sonnet-4-6'

  # Label customization
  label-needs-triage:
    description: 'Label for issues waiting to be triaged'
    default: 'triage: needs triage'
  label-not-actionable:
    description: 'Label for issues that are not bug reports'
    default: 'triage: not actionable'
  label-needs-reproduction:
    description: 'Label for issues missing a reproduction'
    default: 'triage: needs reproduction'
  label-skipped:
    description: 'Label for issues that cannot be triaged in CI'
    default: 'triage: skipped'
  label-unable-to-reproduce:
    description: 'Label for issues the agent could not reproduce'
    default: 'triage: unable to reproduce'
  label-unable-to-fix:
    description: 'Label for reproduced issues where no fix was found'
    default: 'triage: unable to fix'
  label-failed:
    description: 'Label for issues where triage failed unexpectedly and can be retried'
    default: 'triage: failed'
  label-fix-pending:
    description: 'Label for issues with a fix awaiting reporter confirmation'
    default: 'triage: fix pending'
  label-fix-rejected:
    description: 'Label for issues where the reporter says the fix does not work'
    default: 'triage: fix rejected'
  label-fix-verified:
    description: 'Label for issues where the reporter confirmed the fix works'
    default: 'triage: fix verified'
  pr-label-fix-verified:
    description: 'Label to apply to PRs created from verified fixes'
    default: 'fix verified'

runs:
  # Must stay >= node22: @flue/runtime declares engines ">=22.18.0" and the
  # bundle calls process.getBuiltinModule (Node 22.3+). Older Gitea act_runners
  # reject anything above node20 — see "Running on Gitea" in the README for the
  # direct-invocation workflow that sidesteps runs.using entirely.
  using: 'node24'
  main: 'dist/index.mjs'
